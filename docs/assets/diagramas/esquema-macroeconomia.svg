<rect class="cab" x="280" y="16" width="224" height="32"/>
<rect class="chip" x="290" y="53" width="22" height="14" rx="2"/>
<text class="tag" x="301" y="63" text-anchor="middle">PK</text>
<text class="col" x="320" y="64">data_referencia</text>
<text class="tipo" x="492" y="64" text-anchor="end">DATE</text>
<rect class="zebra" x="280" y="72" width="224" height="24"/>
<text class="col" x="320" y="88">taxa_dia_pct</text>
<text class="tipo" x="492" y="88" text-anchor="end">DOUBLE</text>
<text class="col" x="320" y="112">observado</text>
<text class="tipo" x="492" y="112" text-anchor="end">BOOLEAN</text>
</g>
<line class="fio" x1="280" y1="48" x2="504" y2="48"/>
<rect class="caixa" style="fill:none" x="280" y="16" width="224" height="104" rx="6"/>
<text class="nome" x="292" y="37">selic_taxa</text>
<text class="tag" x="492" y="36" text-anchor="end">DUCKDB</text>
</svg>
