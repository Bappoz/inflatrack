<rect class="cab" x="16" y="16" width="224" height="32"/>
<rect class="chip" x="26" y="53" width="22" height="14" rx="2"/>
<text class="tag" x="37" y="63" text-anchor="middle">PK</text>
<text class="col" x="56" y="64">data_referencia</text>
<text class="tipo" x="228" y="64" text-anchor="end">DATE</text>
<rect class="zebra" x="16" y="72" width="224" height="24"/>
