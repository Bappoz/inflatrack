<text class="tipo" x="228" y="88" text-anchor="end">DOUBLE</text>
<text class="col" x="56" y="112">cotacao_venda</text>
<text class="tipo" x="228" y="112" text-anchor="end">DOUBLE</text>
<rect class="zebra" x="16" y="120" width="224" height="24"/>
<text class="col" x="56" y="136">observado</text>
<text class="tipo" x="228" y="136" text-anchor="end">BOOLEAN</text>
</g>
<line class="fio" x1="16" y1="48" x2="240" y2="48"/>
