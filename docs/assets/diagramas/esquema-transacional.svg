<title id="esquema-transacional-title">Esquema físico do banco transacional do lojista</title>
<desc id="esquema-transacional-desc">Um lojista tem produtos e cada produto tem um histórico de reajustes, apagados em cascata; lojista e produto apontam para a localidade e a classificação de referência do IPCA.</desc>
