<rect class="cab" x="288" y="16" width="240" height="32"/>
<rect class="chip" x="298" y="53" width="22" height="14" rx="2"/>
<text class="tag" x="309" y="63" text-anchor="middle">PK</text>
<text class="col" x="328" y="64">symbol</text>
<text class="tipo" x="516" y="64" text-anchor="end">VARCHAR</text>
