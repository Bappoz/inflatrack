<title id="esquema-sidra-title">Esquema físico do IPCA/INPC no PostgreSQL</title>
<desc id="esquema-sidra-desc">A tabela de fato observacao referencia fonte_agregado, classificacao, localidade e variavel; classificacao_versao guarda o nome de cada código por fonte e vigência.</desc>
