<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 348" width="728" height="348" role="img" aria-labelledby="esquema-clima-title esquema-clima-desc">
<title id="esquema-clima-title">Esquema físico do clima no DuckDB</title>
<desc id="esquema-clima-desc">Cada estação meteorológica registra uma linha de clima por dia.</desc>
<defs>
<style>.dg text{font-family:var(--inflatrack-font-body,Inter,system-ui,sans-serif)}.dg .nome{font-size:13px;font-weight:600;fill:var(--dg-ink,#1A132F)}.dg .col{font-size:12px;fill:var(--dg-ink,#1A132F)}.dg .sub,.dg .tipo,.dg .rot,.dg .tag,.dg .zona-t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.dg .sub{font-size:10px;fill:var(--dg-muted,#5B5675)}.dg .tipo{font-size:10px;fill:var(--dg-muted,#5B5675)}.dg .rot{font-size:9px;letter-spacing:.06em;fill:var(--dg-muted,#5B5675)}.dg .tag{font-size:8px;font-weight:600;letter-spacing:.1em;fill:var(--dg-brand,#511EB6)}.dg .zona-t{font-size:9px;font-weight:600;letter-spacing:.12em;fill:var(--dg-muted,#5B5675)}.dg .papel{fill:var(--dg-paper,#FFFFFF)}.dg .caixa{fill:var(--dg-surface,#FFFFFF);stroke:var(--dg-line,#8E86AD);stroke-width:1}.dg .dep{fill:var(--dg-brand-tint,#F1EDFB);stroke:var(--dg-brand,#511EB6);stroke-width:1}.dg .foco{fill:var(--dg-accent-tint,#FFEEE9);stroke:var(--dg-accent,#FF5A36);stroke-width:1.2}.dg .ext{fill:var(--dg-zone,#F6F4FC);stroke:var(--dg-line,#8E86AD);stroke-width:1;stroke-dasharray:4 3}.dg .zona{fill:var(--dg-zone,#F6F4FC);stroke:var(--dg-rule,#D9D3EC);stroke-width:1;stroke-dasharray:4 4}.dg .cab{fill:var(--dg-brand-tint,#F1EDFB)}.dg .cab-foco{fill:var(--dg-accent-tint,#FFEEE9)}.dg .zebra{fill:var(--dg-zebra,#FAF9FE)}.dg .fio{stroke:var(--dg-rule,#D9D3EC);stroke-width:1}.dg .chip{fill:none;stroke:var(--dg-brand,#511EB6);stroke-width:.8;opacity:.7}.dg .seta{fill:none;stroke:var(--dg-muted,#5B5675);stroke-width:1.2}.dg .seta-foco{fill:none;stroke:var(--dg-accent,#FF5A36);stroke-width:1.4}.dg .seta-leve{fill:none;stroke:var(--dg-muted,#5B5675);stroke-width:1.2;stroke-dasharray:5 4}.dg .ponta{fill:var(--dg-muted,#5B5675)}.dg .ponta-foco{fill:var(--dg-accent,#FF5A36)}.dg .rot-foco{fill:var(--dg-accent,#FF5A36)}</style>
<marker id="esquema-clima-normal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ponta" points="0 0, 8 3, 0 6"/></marker>
<marker id="esquema-clima-foco" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="ponta-foco" points="0 0, 8 3, 0 6"/></marker>
</defs>
<line class="fio" x1="16" y1="320" x2="712" y2="320"/>
<path class="seta-leve" d="M16,332 L40,332" marker-end="url(#esquema-clima-normal)"/>
<text class="sub" x="50" y="336">relação lógica por estacao_id (sem FK declarada no DDL)</text>
<path class="seta-leve" d="M384,60 L288,60" marker-end="url(#esquema-clima-normal)"/>
<rect class="papel" x="16" y="16" width="272" height="248" rx="6"/>
<clipPath id="esquema-clima-estacao_meteorologica"><rect x="16" y="16" width="272" height="248" rx="6"/></clipPath>
<g clip-path="url(#esquema-clima-estacao_meteorologica)">
<rect class="cab" x="16" y="16" width="272" height="32"/>
<rect class="chip" x="26" y="53" width="22" height="14" rx="2"/>
<text class="tag" x="37" y="63" text-anchor="middle">PK</text>
<text class="col" x="56" y="64">estacao_id</text>
<text class="tipo" x="276" y="64" text-anchor="end">VARCHAR(10)</text>
<rect class="zebra" x="16" y="72" width="272" height="24"/>
<text class="col" x="56" y="88">nome</text>
<text class="tipo" x="276" y="88" text-anchor="end">VARCHAR</text>
<text class="col" x="56" y="112">estado</text>
<text class="tipo" x="276" y="112" text-anchor="end">VARCHAR(2)</text>
<rect class="zebra" x="16" y="120" width="272" height="24"/>
<text class="col" x="56" y="136">tipo</text>
<text class="tipo" x="276" y="136" text-anchor="end">VARCHAR(20)</text>
<text class="col" x="56" y="160">latitude</text>
<text class="tipo" x="276" y="160" text-anchor="end">DOUBLE</text>
<rect class="zebra" x="16" y="168" width="272" height="24"/>
<text class="col" x="56" y="184">longitude</text>
<text class="tipo" x="276" y="184" text-anchor="end">DOUBLE</text>
<text class="col" x="56" y="208">altitude_m</text>
<text class="tipo" x="276" y="208" text-anchor="end">DOUBLE</text>
<rect class="zebra" x="16" y="216" width="272" height="24"/>
<text class="col" x="56" y="232">situacao</text>
<text class="tipo" x="276" y="232" text-anchor="end">VARCHAR(20)</text>
<text class="col" x="56" y="256">atualizado_em</text>
<text class="tipo" x="276" y="256" text-anchor="end">TIMESTAMP</text>
</g>
<line class="fio" x1="16" y1="48" x2="288" y2="48"/>
<rect class="caixa" style="fill:none" x="16" y="16" width="272" height="248" rx="6"/>
<text class="nome" x="28" y="37">estacao_meteorologica</text>
<text class="tag" x="276" y="36" text-anchor="end">DUCKDB</text>
<rect class="papel" x="384" y="16" width="328" height="272" rx="6"/>
<clipPath id="esquema-clima-clima_diario"><rect x="384" y="16" width="328" height="272" rx="6"/></clipPath>
<g clip-path="url(#esquema-clima-clima_diario)">
<rect class="cab" x="384" y="16" width="328" height="32"/>
<rect class="chip" x="394" y="53" width="22" height="14" rx="2"/>
<text class="tag" x="405" y="63" text-anchor="middle">PK</text>
<text class="col" x="424" y="64">estacao_id</text>
<text class="tipo" x="700" y="64" text-anchor="end">VARCHAR(10)</text>
<rect class="zebra" x="384" y="72" width="328" height="24"/>
<rect class="chip" x="394" y="77" width="22" height="14" rx="2"/>
<text class="tag" x="405" y="87" text-anchor="middle">PK</text>
<text class="col" x="424" y="88">data_referencia</text>
<text class="tipo" x="700" y="88" text-anchor="end">DATE</text>
<text class="col" x="424" y="112">temp_min</text>
<text class="tipo" x="700" y="112" text-anchor="end">DOUBLE</text>
<rect class="zebra" x="384" y="120" width="328" height="24"/>
<text class="col" x="424" y="136">temp_max</text>
<text class="tipo" x="700" y="136" text-anchor="end">DOUBLE</text>
<text class="col" x="424" y="160">temp_media</text>
<text class="tipo" x="700" y="160" text-anchor="end">DOUBLE</text>
<rect class="zebra" x="384" y="168" width="328" height="24"/>
<text class="col" x="424" y="184">precipitacao_total_mm</text>
<text class="tipo" x="700" y="184" text-anchor="end">DOUBLE</text>
<text class="col" x="424" y="208">umidade_relativa_media_pct</text>
<text class="tipo" x="700" y="208" text-anchor="end">DOUBLE</text>
<rect class="zebra" x="384" y="216" width="328" height="24"/>
<text class="col" x="424" y="232">umidade_relativa_min_pct</text>
<text class="tipo" x="700" y="232" text-anchor="end">DOUBLE</text>
<text class="col" x="424" y="256">observado</text>
<text class="tipo" x="700" y="256" text-anchor="end">BOOLEAN</text>
<rect class="zebra" x="384" y="264" width="328" height="24"/>
<text class="col" x="424" y="280">atualizado_em</text>
<text class="tipo" x="700" y="280" text-anchor="end">TIMESTAMP</text>
</g>
<line class="fio" x1="384" y1="48" x2="712" y2="48"/>
<rect class="caixa" style="fill:none" x="384" y="16" width="328" height="272" rx="6"/>
<text class="nome" x="396" y="37">clima_diario</text>
<text class="tag" x="700" y="36" text-anchor="end">DUCKDB</text>
</svg>
