site_name: InflaTrack
site_description: Plataforma de dados para reajuste inflacionário do pequeno e médio lojista
site_url: https://bappoz.github.io/inflatrack/
repo_name: Bappoz/inflatrack
repo_url: https://github.com/Bappoz/inflatrack
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/Logo.svg
  favicon: assets/Logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Visão Geral:
    - Sobre: index.md
    - Onboarding: visaoGeral/onboarding.md
    - Cronograma: visaoGeral/cronograma.md
  - Arquitetura: 
    - Visão Geral: arquitetura/visaoGeral.md
    - Fluxo de Dados: arquitetura/fluxoDados.md
    - Arquitetura Medallion: arquitetura/arquiteturaMedallion.md
    - Componentes: arquitetura/componentes.md
    - Fonte Dados:
      - Tabela fontes: arquitetura/fonteDados.md
      - IPCA/INPC (SIDRA): fontes/sidra.md
      - Commodities e Energia: fontes/commodities.md
      - Dólar Comercial (BCB/Olinda): fontes/dolar.md
      - Taxa SELIC (BCB/SGS): fontes/selic.md
      - PIB e Setores (SIDRA 1846): fontes/pib.md
      - PIB da China (World Bank): fontes/pib_china.md
      - Salário Mínimo (DIEESE): fontes/salario_minimo.md
      - Dados do Clima (INMET): fontes/clima.md
    - ADR 0001 (Modelagem da origem): arquitetura.md
    - ADR 0002 (DuckDB único): adr/0002-duckdb-unico.md
    - ADR 0003 (Séries macro diárias): adr/0003-bcb-macro.md
  - Pipeline de Dados:
    - SIDRA (IPCA/INPC): pipeline/pipelineDados.md
    - Macroeconomia: pipeline/pipelineMacro.md
    - Salário Mínimo (DIEESE): pipeline/pipelineSalarioMinimo.md
    - Dados do Clima (INMET): pipeline/pipelineClima.md
  - Dicionário de Dados:
    - Visão Geral: dicionario/dicionario.md
    - IPCA/INPC (SIDRA): dicionario/sidra.md
    - Transacional (Lojista): dicionario/transacional.md
    - Commodities e Energia (Alpha Vantage): dicionario/commodities.md
    - Macroeconomia (Dólar e Selic): dicionario/macroeconomia.md
    - PIB e Setores (SIDRA 1846): dicionario/pib.md
    - PIB da China (World Bank): dicionario/pib_china.md
    - Salário Mínimo (DIEESE): dicionario/salario_minimo.md
    - Dados do Clima (INMET): dicionario/clima.md
  - Evidências:
    - Uso de IA: evidencias/uso_ia.md

extra_css:
  - stylesheets/extra.css
