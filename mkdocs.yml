site_name: InflaTrack
site_description: Plataforma de dados para reajuste inflacionário do pequeno e médio lojista
site_url: https://bappoz.github.io/inflatrack/
repo_name: Bappoz/inflatrack
repo_url: https://github.com/Bappoz/inflatrack
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/Logo.svg
  favicon: assets/Logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Visão Geral:
    - Sobre: index.md
    - Onboarding: visaoGeral/onboarding.md
    - Cronograma: visaoGeral/cronograma.md
  - Arquitetura: 
    - Visão Geral: arquitetura/visaoGeral.md
    - Fluxo de Dados: arquitetura/fluxoDados.md
    - Arquitetura Medallion: arquitetura/arquiteturaMedallion.md
    - Componentes: arquitetura/componentes.md
    - Fonte Dados: arquitetura/fonteDados.md
    - IPCA/INPC (SIDRA): fontes/sidra.md
    - Commodities e Energia: fontes/commodities.md
    - Banco Central (Dólar/Selic): fontes/bcb.md
    - ADR 0001 (Modelagem da origem): arquitetura.md
    - ADR 0002 (Motor Analitico DuckDB): adr_0002_macro.md
  - Pipeline de Dados:
    - SIDRA (IPCA/INPC): pipeline/pipelineDados.md
    - Macroeconomia: pipeline/pipelineMacro.md
  - Dicionário de Dados:
    - Visão Geral: dicionario/dicionario.md
    - IPCA/INPC (SIDRA): dicionario/sidra.md
    - Transacional (Lojista): dicionario/transacional.md
    - Macroeconomia: dicionario/macroeconomia.md
  - Visualização: visualizacao/visualizacao.md
  - Evidências:
    - SIDRA (IPCA): evidencias/evidencias.md
    - Macroeconomia: evidencias/evidencias_macro.md

extra_css:
  - stylesheets/extra.css

