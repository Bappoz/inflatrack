services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inflatrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inflatrack}
      POSTGRES_DB: ${POSTGRES_DB:-inflatrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inflatrack} -d ${POSTGRES_DB:-inflatrack}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  adminer:
    image: adminer:5.4.1-standalone
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  # Banco interno do Metabase (usuários, dashboards, perguntas salvas).
  # Separado do Postgres do projeto para não misturar metadados com dados.
  metabase-db:
    image: postgres:16.4-alpine
    profiles: [bi]
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabase}
      POSTGRES_DB: metabase
    volumes:
      - metabase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Metabase: lê SÓ o Postgres (host `db`, schema `serie`). Não monta o arquivo do DuckDB de
  # propósito: com uma conexão do Metabase aberta nele, o dbt e os loaders não conseguem
  # escrever (testado em 2026-10-30). A Gold chega ao Postgres pelo ativo `serie_postgres`.
  # O painel é recriado do Git com `just metabase-painel` (scripts/sql/metabase/).
  metabase:
    image: ghcr.io/motherduckdb/metabase-duckdb:latest
    profiles: [bi]
    depends_on:
      metabase-db:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabase}
      MB_DB_HOST: metabase-db
    ports:
      - "${METABASE_PORT:-3001}:3000"
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  pgdata:
  metabase_pgdata:
