# Painel do Metabase versionado no Git. O script scripts/metabase_painel.py lê este arquivo
# e cria ou atualiza no Metabase: as conexões, a coleção, uma pergunta por arquivo .sql e
# o dashboard. O que vale é o que está aqui: mudança feita só na interface é sobrescrita
# na próxima sincronização.

[painel]
nome = "InflaTrack — Painel do lojista"
colecao = "InflaTrack (versionado)"
descricao = "Gerado por scripts/metabase_painel.py a partir de scripts/sql/metabase/. Não edite na interface."

# O Metabase lê só o Postgres: a Gold chega em serie.* pelo ativo serie_postgres. Ele nunca
# se conecta ao DuckDB, porque uma conexão aberta no arquivo trava o dbt e os loaders.
# Banco vem do .env. O usuário é o leitor METABASE_PG_USER (papel metabase_leitor: só `serie`),
# criado pelo próprio script; nunca o dono do banco.
[bancos.postgres]
nome = "InflaTrack — Postgres"
engine = "postgres"

# Uma entrada por pergunta. `posicao` é a grade do dashboard (24 colunas de largura).
[[perguntas]]
arquivo = "p1_inflacao_12m_por_setor.sql"
titulo = "Inflação acumulada em 12 meses por setor"
descricao = "Pergunta 1. IPCA, Brasil, último mês divulgado. Lê serie.fct_inflacao_mensal (cópia da Gold)."
banco = "postgres"
grafico = "bar"
eixo_x = "setor"
eixo_y = ["inflacao_12m_pct"]
posicao = { linha = 0, coluna = 0, largura = 12, altura = 9 }

[[perguntas]]
arquivo = "p4_brasil_x_regiao.sql"
titulo = "IPCA e INPC em 12 meses: Brasil x praças"
descricao = "Pergunta 4. Índice geral, último mês divulgado, Brasil primeiro. Lê serie.fct_inflacao_mensal."
banco = "postgres"
grafico = "bar"
eixo_x = "localidade"
eixo_y = ["ipca_12m_pct", "inpc_12m_pct"]
posicao = { linha = 0, coluna = 12, largura = 12, altura = 9 }

[[perguntas]]
arquivo = "p4_brasil_ipca_x_inpc_5_anos.sql"
titulo = "IPCA x INPC em 12 meses, Brasil, últimos 5 anos"
descricao = "Pergunta 4 (evolução). Índice geral, Brasil, 60 meses. Lê serie.fct_inflacao_mensal."
banco = "postgres"
grafico = "line"
eixo_x = "mes_referencia"
eixo_y = ["ipca_12m_pct", "inpc_12m_pct"]
posicao = { linha = 9, coluna = 0, largura = 12, altura = 8 }

[[perguntas]]
arquivo = "p2_sazonalidade_por_mes.sql"
titulo = "Sazonalidade: variação média do IPCA por mês do ano"
