banco = "postgres"
grafico = "line"
eixo_x = "mes"
eixo_y = ["indice_geral_pct", "alimentacao_e_bebidas_pct", "habitacao_pct", "vestuario_pct", "transportes_pct"]
posicao = { linha = 9, coluna = 12, largura = 12, altura = 8 }

[[perguntas]]
arquivo = "p3_poder_de_compra_desde_2006.sql"
