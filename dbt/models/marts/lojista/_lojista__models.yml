version: 2

models:
  - name: dim_produto_preco_scd2
    description: >
      SCD tipo 2. Uma linha por período em que o preço, o custo, o nome e o subitem de um produto do
      lojista ficaram iguais. Derivada do log do CDC, na ordem do negócio: um reajuste registrado
      com atraso entra na posição certa do histórico.
    columns:
      - name: id_versao_preco
        data_tests: [unique, not_null]
      - name: id_produto
        data_tests: [not_null]
      - name: id_lojista
        data_tests: [not_null]
      - name: preco_brl
        data_tests: [not_null]
      - name: custo_brl
        data_tests: [not_null]
      - name: evento_de_abertura
        description: cadastro, alteracao, reajuste ou custo.
        data_tests:
          - accepted_values:
              arguments:
                values: [cadastro, alteracao, reajuste, custo]
      - name: vigencia_inicio
        description: Instante em que a versão passa a valer (entra).
        data_tests: [not_null]
      - name: vigencia_fim
        description: Instante da versão seguinte ou da exclusão (não entra). Nulo = versão aberta.
      - name: versao_atual
        data_tests: [not_null]

  - name: fct_reajuste_lojista
    description: >
      Fato do comerciante. Uma linha representa um produto do lojista em um mês, com o preço
      praticado e a inflação oficial do subitem do produto na praça dele. Responde à pergunta 5
      (reajuste mínimo para não perder para o IPCA). Identifica o estabelecimento só pelo hash.
    columns:
      - name: id_produto
        data_tests: [not_null]
      - name: mes_referencia
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario')
                field: mes_referencia
      - name: id_versao_preco
        description: A versão de preço vigente no fim do mês.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produto_preco_scd2')
                field: id_versao_preco
      - name: hash_estabelecimento
        description: HMAC-SHA256 do CNPJ (pseudônimo). O CNPJ não existe em nenhuma camada analítica.
        data_tests: [not_null]
      - name: codigo_localidade
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_localidade')
                field: codigo_localidade
      - name: origem_ipca
        description: >
          local (a praça do lojista mede o subitem), brasil (não mede, usou o nacional) ou nulo
          (o IBGE não publicou o mês ou o subitem).
      - name: mes_ipca_referencia
        description: Último mês com inflação publicada. Fim da janela de 12 meses das colunas abaixo.
      - name: variacao_preco_12m_pct
        description: >
          Preço atual contra o de 12 meses antes de mes_ipca_referencia, ou contra o do cadastro, se
          o produto for mais novo.
      - name: ipca_acum_12m_pct
        description: IPCA do subitem na mesma janela (sem o mês do cadastro).
      - name: defasagem_12m_pct
        description: >
          Quanto o preço ficou para trás do IPCA do subitem. Positivo = preço abaixo da inflação;
          negativo = reajustou acima dela.
      - name: reajuste_minimo_pct
        description: O reajuste que recupera a defasagem; zero se o preço já acompanhou o IPCA.
