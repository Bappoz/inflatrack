version: 2

models:
  - name: stg_clima__estacao
    description: Uma linha pela versão mais recente do cadastro de cada estação INMET.
    columns:
      - name: estacao_id
        data_tests: [unique, not_null]
      - name: estado
        data_tests: [not_null]
  - name: stg_clima__medicao_diaria
    description: >
      Uma linha por estação x dia: a última revisão do INMET (BDMEP) e, só depois do último
      dia oficial, o provisório do Open-Meteo. Grão garantido por
      assert_stg_clima__medicao_diaria_chave_unica.
    columns:
      - name: estacao_id
        data_tests: [not_null]
      - name: data_referencia
        data_tests: [not_null]
      - name: fonte
        description: inmet_bdmep (medido) ou open_meteo (provisório, modelo em grade).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [inmet_bdmep, open_meteo]
      - name: observado
        description: Verdadeiro na medição do INMET; falso no provisório do Open-Meteo.
        data_tests: [not_null]