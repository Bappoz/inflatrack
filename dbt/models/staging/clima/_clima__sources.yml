version: 2

sources:
  - name: bronze_clima
    description: Dados meteorológicos do INMET promovidos da Bronze Delta pelo loader.
    schema: bronze
    tables:
      - name: clima_estacao
        config:
          meta:
            dagster:
              asset_key: ["clima_duckdb"]
        description: Cadastro versionado das estações meteorológicas.
        columns:
          - name: estacao_id
            data_tests: [not_null]
          - name: _ingerido_em
            data_tests: [not_null]
      - name: clima_medicao
        config:
          meta:
            dagster:
              asset_key: ["clima_medicoes_duckdb"]
        description: Uma linha por versão de leitura diária e estação (oficial, BDMEP).
        columns:
          - name: id_medicao
            data_tests: [unique, not_null]
          - name: estacao_id
            data_tests: [not_null]
          - name: data_referencia
            data_tests: [not_null]
          - name: _ingerido_em
            data_tests: [not_null]
      - name: clima_medicao_provisoria
        config:
          meta:
            dagster:
              asset_key: ["clima_provisorio_duckdb"]
        description: >
          Uma linha por versão de dia provisório (Open-Meteo, modelo em grade) para os dias que
          o INMET ainda não publicou. A staging só usa o que vem depois do último dia oficial.
        columns:
          - name: id_medicao
            data_tests: [unique, not_null]
          - name: estacao_id
            data_tests: [not_null]
          - name: data_referencia
            data_tests: [not_null]
          - name: fonte
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [open_meteo]