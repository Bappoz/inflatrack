version: 2

sources:
  - name: bronze_enso
    description: RONI (El Niño / La Niña) do NOAA, promovido da Bronze Delta pelo loader.
    schema: bronze
    tables:
      - name: enso_roni
        config:
          meta:
            dagster:
              asset_key: ["enso_duckdb"]
        description: Uma linha por versão de valor de temporada (mês central).
        columns:
          - name: id_leitura
            data_tests: [unique, not_null]
          - name: mes_referencia
            data_tests: [not_null]
          - name: roni
            data_tests: [not_null]
