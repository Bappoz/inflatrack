[project]
name = "inflatrack"
version = "0.1.0"
description = "Ingestão do IPCA/INPC do SIDRA para o banco transacional do InflaTrack"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0"]
docs = ["mkdocs>=1.6.0", "mkdocs-material>=9.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inflatrack"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
